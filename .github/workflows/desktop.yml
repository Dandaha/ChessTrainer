# Builds the Windows installer on a GitHub Windows machine and publishes it as a release.
# Download it from the repository's Releases page (latest release, Chess-Workspace-Setup-<version>.exe).
name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Bundle the app
        run: node apps/desktop/scripts/build.mjs --install

      - name: Download Stockfish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path sf, apps/desktop/stockfish | Out-Null
          # Stockfish 19 ships one universal Windows build; older releases had one per CPU (avx2, plain...).
          gh release download --repo official-stockfish/Stockfish --pattern "stockfish-windows-x86-64*.zip" --dir sf
          if ($LASTEXITCODE -ne 0) { throw "Could not download Stockfish" }
          Get-ChildItem sf | Format-Table Name, Length
          $rank = { param($n) if ($n -match 'universal') { 0 } elseif ($n -match 'avx2') { 1 } elseif ($n -match 'x86-64\.zip$') { 2 } else { 3 } }
          $zip = Get-ChildItem sf -Filter "*.zip" | Sort-Object { & $rank $_.Name } | Select-Object -First 1
          Write-Host "Using $($zip.Name)"
          Expand-Archive $zip.FullName -DestinationPath sf/x
          # The zip holds one folder with the program, its licence and its source: keep all of it.
          $root = Get-Item sf/x
          $inner = @(Get-ChildItem sf/x)
          if ($inner.Count -eq 1 -and $inner[0].PSIsContainer) { $root = $inner[0] }
          Copy-Item (Join-Path $root.FullName '*') apps/desktop/stockfish -Recurse -Force
          $exe = Get-ChildItem apps/desktop/stockfish -Filter "stockfish*.exe" | Sort-Object { & $rank $_.Name } | Select-Object -First 1
          if (-not $exe) { Get-ChildItem apps/desktop/stockfish -Recurse | Select-Object -First 40 FullName; throw "No stockfish*.exe at the top of the zip's folder" }
          Write-Host "Engine: $($exe.Name)"
          $answer = "uci`nquit`n" | & $exe.FullName
          $answer | Select-String '^id name'
          if (-not ($answer -match 'uciok')) { throw "$($exe.Name) did not answer as a UCI engine" }
          Get-ChildItem apps/desktop/stockfish | Format-Table Name, Length

      - name: Build the installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win nsis --x64 --config electron-builder.yml

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter "*.exe" | Select-Object -First 1
          gh release create "v$env:APP_VERSION" $exe.FullName --title "Chess Workspace $env:APP_VERSION" --latest --notes "Windows installer, built from $env:GITHUB_SHA. Download $($exe.Name) below and run it."
