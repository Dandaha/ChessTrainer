# Builds the Windows installer on a GitHub Windows machine and publishes it as a release.
# Download it from the repository's Releases page (latest release, Chess-Workspace-Setup-<version>.exe).
name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
      # The Stockfish build that ships with the app: a fixed release, checked by its SHA-256 (the digest
      # GitHub lists for the asset). To move to a newer Stockfish, change both together.
      STOCKFISH_TAG: sf_19
      STOCKFISH_ZIP: stockfish-windows-x86-64-universal.zip
      STOCKFISH_SHA256: 3c8bf1f9ea66a09350a40df4f632288285ac206d99f33ab5842c408fc30b48a7
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Bundle the app
        run: node apps/desktop/scripts/build.mjs --install

      - name: Download Stockfish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path sf, apps/desktop/stockfish | Out-Null
          gh release download $env:STOCKFISH_TAG --repo official-stockfish/Stockfish --pattern $env:STOCKFISH_ZIP --dir sf
          if ($LASTEXITCODE -ne 0) { throw "Could not download $env:STOCKFISH_ZIP from Stockfish $env:STOCKFISH_TAG" }
          $zip = Get-Item "sf/$env:STOCKFISH_ZIP"
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "$($zip.Name): $($zip.Length) bytes, sha256 $hash"
          if ($hash -ne $env:STOCKFISH_SHA256) { throw "The Stockfish download does not match the pinned SHA-256 ($env:STOCKFISH_SHA256)" }
          $rank = { param($n) if ($n -match 'universal') { 0 } elseif ($n -match 'avx2') { 1 } else { 2 } }
          Expand-Archive $zip.FullName -DestinationPath sf/x
          # The zip holds one folder with the program, its licence and its source: keep all of it.
          $root = Get-Item sf/x
          $inner = @(Get-ChildItem sf/x)
          if ($inner.Count -eq 1 -and $inner[0].PSIsContainer) { $root = $inner[0] }
          Copy-Item (Join-Path $root.FullName '*') apps/desktop/stockfish -Recurse -Force
          $exe = Get-ChildItem apps/desktop/stockfish -Filter "stockfish*.exe" | Sort-Object { & $rank $_.Name } | Select-Object -First 1
          if (-not $exe) { Get-ChildItem apps/desktop/stockfish -Recurse | Select-Object -First 40 FullName; throw "No stockfish*.exe at the top of the zip's folder" }
          Write-Host "Engine: $($exe.Name)"
          $answer = "uci`nquit`n" | & $exe.FullName
          $answer | Select-String '^id name'
          if (-not ($answer -match 'uciok')) { throw "$($exe.Name) did not answer as a UCI engine" }
          Get-ChildItem apps/desktop/stockfish | Format-Table Name, Length

      - name: Build the installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win nsis --x64 --config electron-builder.yml --publish never

      - name: Check that the packaged app starts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Item "apps/desktop/release/win-unpacked/Chess Workspace.exe").FullName
          # 1. The database driver loads in this Electron (the app run in Node mode, as the MCP server is).
          $env:ELECTRON_RUN_AS_NODE = '1'
          $check = Start-Process -FilePath $exe -ArgumentList 'apps/desktop/scripts/check-packed.cjs', 'apps/desktop/release/win-unpacked/resources/app' -Wait -PassThru -NoNewWindow -RedirectStandardOutput check.out -RedirectStandardError check.err
          Get-Content check.out, check.err
          if ($check.ExitCode -ne 0) { throw "The packaged app cannot load its database driver" }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          # Where the installed app looks for updates.
          Get-Content apps/desktop/release/win-unpacked/resources/app-update.yml
          if (-not (Select-String -Path apps/desktop/release/win-unpacked/resources/app-update.yml -Pattern 'ChessTrainer' -Quiet)) { throw "app-update.yml does not point at the releases" }
          # 2. The app itself starts its local server and finds the bundled Stockfish.
          $app = Start-Process -FilePath $exe -PassThru
          try {
            $info = $null
            for ($i = 0; $i -lt 45 -and -not $info; $i++) {
              Start-Sleep -Seconds 2
              try { $info = Invoke-RestMethod http://127.0.0.1:47123/api/system/info } catch { }
            }
            if (-not $info) {
              $log = Join-Path $env:APPDATA 'Chess Workspace/startup-error.txt'
              if (Test-Path $log) { Get-Content $log }
              throw "The app did not start its local server"
            }
            Write-Host "Data folder: $($info.dataDir)"
            $engine = $null
            for ($i = 0; $i -lt 15 -and -not ($engine -and $engine.bundled); $i++) {
              Start-Sleep -Seconds 2
              $engine = Invoke-RestMethod http://127.0.0.1:47123/api/engine/status
            }
            $engine | ConvertTo-Json -Compress
            if (-not $engine.bundled -or $engine.error) { throw "The app did not start the bundled Stockfish" }
            $page = Invoke-WebRequest http://127.0.0.1:47123/
            if ($page.Content -notmatch '<div id="root">') { throw "The app did not serve its pages" }
            Write-Host "The packaged app works: server, database, pages and $($engine.name)"
            # The update check runs in the background; its log shows that it reached the releases.
            Start-Sleep -Seconds 5
            $updates = Join-Path $env:APPDATA 'Chess Workspace/updates.log'
            if (Test-Path $updates) { Get-Content $updates } else { Write-Host "No update log yet" }
          } finally {
            Get-Process -Name 'Chess Workspace', 'stockfish*' -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The installer, plus what the installed apps read to update themselves:
          # latest.yml (version and checksum) and the blockmap (to download only what changed).
          $release = 'apps/desktop/release'
          $exe = "$release/Chess-Workspace-Setup-$env:APP_VERSION.exe"
          $files = @($exe, "$exe.blockmap", "$release/latest.yml")
          foreach ($file in $files) { if (-not (Test-Path $file)) { throw "Missing $file" } }
          Get-Content "$release/latest.yml"
          gh release create "v$env:APP_VERSION" @files --title "Chess Workspace $env:APP_VERSION" --latest --notes "Windows installer, built from $env:GITHUB_SHA. The app updates itself; for a first install, download Chess-Workspace-Setup-$env:APP_VERSION.exe below and run it."
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the release" }
