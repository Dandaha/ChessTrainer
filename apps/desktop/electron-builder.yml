# Builds the Windows installer from the folder scripts/build.mjs prepares.
appId: com.dandaha.chessworkspace
productName: Chess Workspace
copyright: Personal use
directories:
  app: stage
  output: release
  buildResources: build
# Plain files instead of an archive: the MCP script and the database driver run from them directly.
asar: false
npmRebuild: false
# The packager collects node_modules from the pnpm workspace, where the database driver is built for
# Node, not Electron: this hook swaps in stage/node_modules, which build.mjs --install made for Electron.
afterPack: scripts/afterPack.cjs
electronVersion: 42.11.18
files:
  - "**/*"
extraResources:
  - from: stockfish
    to: stockfish
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Chess Workspace
  artifactName: Chess-Workspace-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
publish: null
